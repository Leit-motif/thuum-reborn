# Two mechanical checks the release path is owed.
#
# The lint is the cheap one and the one that earns its place: source under src/ and include/ ships
# to the public verbatim, and the private tracker it grew up beside does not, so a returning
# "ticket 45" or "A45.9" points a stranger at nothing. Catching that where the comment is written
# beats catching it at release assembly.
#
# The build job is slow because CommonLibSSE-NG is large, and "large" is the whole story: measured
# on 2026-09-02, a successful build job runs about 26 minutes, of which roughly 24 are
# `cmake --build` compiling the CommonLibSSE-NG submodule from source and about 2.5 are vcpkg
# installing the nine manifest dependencies. Anything that only speeds up vcpkg is worth minutes,
# not tens of minutes.
#
# WHAT IT COSTS, MEASURED 2026-09-01. In the 30 days to that date this workflow billed 1,492 minutes
# of a 2,000-minute monthly allowance, and 1,358 of them were the build job alone -- Windows runners
# bill at 2x, so a 14.8-minute build is about 30 billed minutes every time it starts. The allowance
# ran out, and for two days nothing was verified at all because every job was refused before it
# started. The two filters below exist so that does not happen again. Neither reduces what is
# checked when the source changes.

name: CI

on:
  push:
    branches: [main]
    # A commit that changes only prose cannot change what any of these three jobs report: the lint
    # reads src/ and include/, and the other two compile them. Checked against the 25 commits before
    # this one -- 15 touched nothing but docs/ and .md, and each of those paid for a full run.
    #
    # The list is deliberately short. tools/, tests/, config/, pack/, cmake/ and .github/ all still
    # trigger, because each of them does reach a job; the ten commits in that sample that touched
    # any of them would still have run. Widen this only against the same kind of check.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # A pull request is a deliberate review moment and is left unfiltered on purpose.
  pull_request:
  workflow_dispatch:

# Three commits landed within eleven minutes on 2026-08-31 and started three complete Windows
# builds, two of them for a tip that no longer existed by the time they finished. Only the current
# tip has to be green, so a newer push cancels the older run rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archaeology-lint:
    name: archaeology lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint src/ and include/ for internal chronology
        run: node tools/lint-archaeology.mjs

  host-tests:
    name: host suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The host suite is a standalone CMake project on purpose -- it pulls in no game SDK, so it
      # configures and runs in seconds without vcpkg or the submodule.
      - name: Configure
        run: cmake -S tests -B build-tests
      - name: Build
        run: cmake --build build-tests --config Release
      - name: Run
        run: ctest --test-dir build-tests -C Release --output-on-failure

  build:
    name: build the DLL
    # PINNED, not `windows-latest`. The `ALL` preset names the "Visual Studio 17 2022" generator,
    # and the rolling label has moved past it -- a `windows-latest` run fails configure with
    # "could not find any instance of Visual Studio". Move this label and the preset together.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # This job used to set VCPKG_BINARY_SOURCES to "clear;x-gha,readwrite", which cached nothing
      # at all and said so on every run: "the 'x-gha' binary caching backend has been removed".
      # `clear` switched OFF vcpkg's own default archive cache, and the backend named in its place
      # no longer exists, so all nine dependencies were rebuilt from source every time. Restoring
      # vcpkg's default files cache through actions/cache is the supported replacement.
      #
      # The key is the manifest, which carries the builtin-baseline, so a dependency or baseline
      # change invalidates it and nothing else does.
      - name: Cache the vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        # The runner ships vcpkg already, at VCPKG_INSTALLATION_ROOT, and the preset reads
        # VCPKG_ROOT. Copied in the shell rather than through `env:` with an `${{ env.… }}`
        # expression: that context holds only what the workflow itself defines, so the runner's
        # own variable expands to empty there and configure fails looking for
        # "/scripts/buildsystems/vcpkg.cmake".
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset ALL

      - name: Build
        run: cmake --build build --config Release

      - name: Upload the staged plugin
        uses: actions/upload-artifact@v4
        with:
          name: ShoutMCO-Release
          path: |
            dist/SKSE/Plugins/ShoutMCO.dll
            dist/SKSE/Plugins/ShoutMCO.ini
            dist/include/ShoutMCO_CastIntent.h
          if-no-files-found: error
