# Two mechanical checks the release path is owed.
#
# The lint is the cheap one and the one that earns its place: source under src/ and include/ ships
# to the public verbatim, and the private tracker it grew up beside does not, so a returning
# "ticket 45" or "A45.9" points a stranger at nothing. Catching that where the comment is written
# beats catching it at release assembly.
#
# The build job is slow because CommonLibSSE-NG is large. It caches vcpkg's binaries, so the first
# run pays for the rest.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  archaeology-lint:
    name: archaeology lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint src/ and include/ for internal chronology
        run: node tools/lint-archaeology.mjs

  host-tests:
    name: host suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The host suite is a standalone CMake project on purpose -- it pulls in no game SDK, so it
      # configures and runs in seconds without vcpkg or the submodule.
      - name: Configure
        run: cmake -S tests -B build-tests
      - name: Build
        run: cmake --build build-tests --config Release
      - name: Run
        run: ctest --test-dir build-tests -C Release --output-on-failure

  build:
    name: build the DLL
    # PINNED, not `windows-latest`. The `ALL` preset names the "Visual Studio 17 2022" generator,
    # and the rolling label has moved past it -- a `windows-latest` run fails configure with
    # "could not find any instance of Visual Studio". Move this label and the preset together.
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # vcpkg's GitHub Actions binary cache needs these two handed to it explicitly.
      - name: Export the Actions cache endpoints for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        # The runner ships vcpkg already, at VCPKG_INSTALLATION_ROOT, and the preset reads
        # VCPKG_ROOT. Copied in the shell rather than through `env:` with an `${{ env.… }}`
        # expression: that context holds only what the workflow itself defines, so the runner's
        # own variable expands to empty there and configure fails looking for
        # "/scripts/buildsystems/vcpkg.cmake".
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset ALL

      - name: Build
        run: cmake --build build --config Release

      - name: Upload the staged plugin
        uses: actions/upload-artifact@v4
        with:
          name: ShoutMCO-Release
          path: |
            dist/SKSE/Plugins/ShoutMCO.dll
            dist/SKSE/Plugins/ShoutMCO.ini
            dist/include/ShoutMCO_CastIntent.h
          if-no-files-found: error
