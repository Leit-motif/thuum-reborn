; Thu'um Reborn 1.0.4
;
; Edits take effect on your NEXT shout. No game restart, no new save.

[Engine]

; Diagnostic log, written to:
;   Documents\My Games\Skyrim Special Edition\SKSE\ShoutMCO.log
;
;   0 = off (default, and where it should stay)
;   1 = on -- for capturing a bug report, then turn it straight back off.
;
; At 1 this records EVERY animation event on your character. With a weapon drawn one of them fires
; about every 17ms, so expect a multi-megabyte file and constant disk writes during combat.
;
; At 0 you still get the startup lines and any error. That is enough for someone to diagnose a
; failure to load or a bad setting here, so leaving it off costs you nothing when reporting a bug.
bTrace = 0

[Shout]

; How long you must HOLD the shout key for the SECOND word, in seconds.
;
; This is the fix for a tap that comes out as a two-word shout. The game promotes your hold to word
; two at 0.2 seconds -- that is vanilla's own number, and nothing in a normal load order moves it.
; 0.2 s is inside an ordinary deliberate press, so a tap you meant as one word charges to two. You
; never notice it in vanilla because vanilla barely animates the difference; with fully animated
; shouts you see the wrong shout play.
;
;   0.4 = default. A tap is reliably ONE word.
;   0.2 = vanilla. Set this if you would rather have the stock timing back.
;     0 = leave the game's value completely alone, whatever it is.
;
; The trade: this is the same number in both directions. Raising it means a
; tap stays one word, and it ALSO means every two-word shout needs a longer hold before it charges.
; At 0.4 that is about a fifth of a second more than vanilla. Lower it if two-word shouts start
; feeling sticky, raise it if taps are still coming out as two words.
;
; Nothing is edited or saved. The value is written into the running game each time you shout, and
; put back if you set this to 0, so deleting the mod restores your game exactly.
fWordTwoHoldSec = 0.4

; The same thing for the THIRD word, in seconds.
;
;     0 = default: leave the game's own 0.9 seconds alone.
;
; Off by default on purpose. Vanilla's 0.9 s is nowhere near a tap, so it is not part of the problem
; above, and raising it would only make three-word shouts harder to reach. Set a number here only if
; you pushed fWordTwoHoldSec up a long way and want the gap to the third word widened to match.
;
; It must be LARGER than fWordTwoHoldSec. A value at or below it would ask for the third word no
; later than the second, which the game cannot do -- that is ignored, and a line in the log says so.
fWordThreeHoldSec = 0

[Chain]

; What happens when you shout in the MIDDLE of an MCO attack.
;   1 = the shout waits for your swing to land, then fires (default)
;   0 = vanilla timing -- the shout starts immediately
;
; At 0, a shout pressed mid-swing cancels that attack before it connects: the hit is lost and your
; character drops out of the moveset. That is the exact problem this setting exists to fix, so set
; it to 0 only if you would rather have an instant shout and do not mind losing the hit.
;
; At 1 the wait ends the moment your swing connects -- the mod cuts the recovery short rather than
; making you sit through it, so the shout comes out roughly a third of the way into a one-handed
; swing instead of at the end of it.
;
; A shout pressed with no attack running is untouched either way. Multi-word shouts still charge
; normally: keep holding and your hold continues.
bShoutWaitsForSwing = 1

; How much of the END of a shout you can cancel into an attack, as a PERCENTAGE of that shout.
;
; Press attack during a shout and the press is remembered immediately -- it fires when this window
; opens, not when you pressed. Smaller = the shout plays longer before you can leave it, which is
; more deliberate and more committed. Larger = you can break out earlier.
;
;    45 = default. You are held through the shout itself and get the last 45% -- the recovery, the
;         part where the character is just straightening up -- back to attack in. That is about what
;         MCO gives you to chain out of one of its own light attacks.
;     0 = no window; the attack fires when the shout ends on its own.
;
; THIS ALSO SETS HOW FAST SHOUT CHAINS INTO SHOUT. When you shout again during this window, the
; mod cuts the rest of the exhale rather than making you sit through it, so a larger number here
; means a snappier shout-to-shout chain as well as an earlier attack. Measured on a one-word shout:
; no cut at all was 1.44s between shouts, 30 gives 1.22s and 60 gives 1.04s. Turn it down if the
; shout starts feeling clipped, up if you cannot tell whether the chain happened.
;
; A PERCENTAGE, NOT A FIXED TIME, and that matters if your pack has long shouts. The mod learns each
; animation's length from your own pack the first time you use it, and takes the last 45% of
; whatever it measured. A fixed number of milliseconds would give you the same slice back whatever
; the shout, so the longer the animation the smaller your share: 300 ms is 29% of a one-word shout
; but only 8% of a four-second one, which would leave you stuck longest in the biggest shouts. The
; first shout of each type opens the window early while it measures.
;
; Word count is learned too, so a one-word and a three-word version of the same shout are timed
; separately rather than sharing one measurement.
iChainWindowPct = 45

; Where a POWER attack press comes from. Load orders genuinely differ here, so this looks rather
; than assumes.
;   auto = decide by looking (default). If One Click Power Attack (OCPA or OCPA NG) is installed,
;          its key is used. Otherwise a HELD attack button is the power press, which is what
;          vanilla and MCO alone give you.
;   ocpa = force OCPA's key (falls back to hold if no key can be found)
;   hold = force held attack button
;   off  = no power chaining. Shouts still chain into normal attacks.
;
; Use `off` if you run a power attack mod this engine does not recognise. The known case is Elden
; Power Attack, which makes HOLDING attack do repeated light attacks and moves power onto a Shift
; combination -- on `auto` a held button could start a power chain you never asked for.
sPowerSource = auto

; Which key counts as the power attack, when the setting above resolves to a key.
;   -1 = read OCPA's own config (default), so your OCPA binding is followed automatically and
;        lives in exactly one place
;    0 = no key
;   any other number = that key is the power attack key
;
; Set a number here if you use some other mod that puts power attack on a single key. Values are
; DirectX scan codes; mouse buttons are 256 + button index, so left is 256, right 257, middle 258.
iPowerAttackKeycode = -1
